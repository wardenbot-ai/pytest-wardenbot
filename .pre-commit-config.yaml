# Pre-commit hooks for pytest-wardenbot contributors.
#
# Install once:
#     pip install pre-commit
#     pre-commit install
#
# Run on all files (CI does this on every PR):
#     pre-commit run --all-files
#
# Hook versions are pinned; update with `pre-commit autoupdate`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.409
    hooks:
      - id: pyright
        additional_dependencies:
          - pytest>=8
          - pydantic>=2
          - httpx>=0.27

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Baseline file records ACCEPTED known-not-a-secret matches.
        # Regenerate when needed:
        #   detect-secrets scan > .secrets.baseline
        # Then review the additions to make sure none are real secrets.
        args: ["--baseline", ".secrets.baseline"]
        # Skip noisy directories.
        exclude: |
          (?x)^(
              .venv/.*|
              site/.*|
              dist/.*|
              .pytest-eval-work/.*|
              scripts/evaluation/results/.*|
              .*\.lock|
              .*\.pyc
          )$
