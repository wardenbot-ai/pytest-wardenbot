[project]
name = "pytest-wardenbot"
version = "0.1.0"
description = "Pytest plugin for testing chatbots and LLM apps — prompt injection, jailbreaks, system-prompt leaks, hallucinations, brand drift."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "WardenBot AI", email = "hello@wardenbot.ai" },
]
keywords = [
    "pytest",
    "pytest-plugin",
    "llm",
    "chatbot",
    "ai-safety",
    "prompt-injection",
    "red-teaming",
    "llm-security",
    "ai-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pytest>=8.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
judge = ["deepeval>=2.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-cov>=5.0",
    "build>=1.0",
    # Required to run the async adapter tests directly; pytest-asyncio is
    # transitively present via [judge] (DeepEval depends on it), but contributors
    # working without [judge] still need it.
    "pytest-asyncio>=0.24",
    # Stub OpenAI + Anthropic clients in tests live in tests/fixtures/, but
    # AsyncHTTPChatbotAdapter tests exercise httpx.MockTransport with AsyncClient
    # which is part of httpx itself — no extra dep needed there.
]

[project.entry-points.pytest11]
wardenbot = "pytest_wardenbot.plugin"

[project.urls]
Homepage = "https://wardenbot.ai/pytest-plugin"
Documentation = "https://pytest-wardenbot.wardenbot.ai/"
Repository = "https://github.com/pardamike/pytest-wardenbot"
Issues = "https://github.com/pardamike/pytest-wardenbot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_wardenbot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "ASYNC", "A", "T20", "RUF", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/pytest_wardenbot/tests/**" = ["S101"]
# Eval scripts are CLI tools — print is the user interface.
"scripts/evaluation/**" = ["T201"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "wardenbot: marks tests provided by pytest-wardenbot",
    "severity_high: high-severity wardenbot test",
    "severity_medium: medium-severity wardenbot test",
    "severity_low: low-severity wardenbot test",
]
# pytest-asyncio is brought in transitively by the [judge] extra (DeepEval
# depends on it). We don't use async fixtures ourselves; suppress its
# default-scope deprecation notice rather than configuring a value we don't
# actually need.
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source_pkgs = ["pytest_wardenbot"]
branch = true
# Cover entry-point-loaded modules that are imported before pytest-cov starts.
parallel = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
