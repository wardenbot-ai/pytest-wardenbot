name: wardenbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  wardenbot:
    name: pytest-wardenbot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest-wardenbot
        run: |
          python -m pip install --upgrade pip
          # Replace with `pip install 'pytest-wardenbot[judge]'` to enable LLM-judge tests.
          pip install pytest-wardenbot

      - name: Run wardenbot tests
        env:
          CHATBOT_URL: ${{ secrets.CHATBOT_URL }}
          CHATBOT_TOKEN: ${{ secrets.CHATBOT_TOKEN }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # uncomment if using [judge]
        run: pytest -v --tb=short

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":warning: pytest-wardenbot failed on ${{ github.repository }}@${{ github.ref_name }} (commit ${{ github.sha }})\"}" \
            "$SLACK_WEBHOOK_URL"
