name: CI

# Actions are referenced by major-version tag (@v4, @v5) for CI convenience —
# Dependabot (.github/dependabot.yml) tracks SHA updates and proposes
# narrowing PRs as new patches land. The release workflow
# (.github/workflows/release.yml) SHA-pins explicitly because that's the
# supply-chain-critical publish path; CI's build job is verification only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same PR/branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  DEEPEVAL_UPDATE_WARNING_OPT_OUT: "YES"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit==4.5.1
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with judge extra (so deepeval types resolve)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,judge]"
      - name: pyright
        run: pyright

  test:
    name: Test (Python ${{ matrix.python-version }}, pytest ${{ matrix.pytest }})
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
      id-token: write  # OIDC token for tokenless Codecov upload (use_oidc)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        pytest: [current]
        include:
          - python-version: "3.11"
            pytest: minimum
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + current dev deps
        if: matrix.pytest == 'current'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install minimum pytest and compatible test harness
        if: matrix.pytest == 'minimum'
        # pytest-asyncio 0.24+ requires pytest 8.2+, so this core-support
        # lane uses an older harness without installing the [async] extra.
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pytest==8.1.1" "pytest-asyncio==0.23.8" "pytest-cov==5.0.0"

      - name: Report resolved versions
        run: pip list

      - name: Run tests with coverage
        # Using `coverage run -m pytest` instead of `pytest --cov` so that the
        # plugin's entry-point-loaded modules (loaded before pytest-cov starts)
        # are also measured.
        run: |
          coverage run -m pytest -ra
          coverage report --fail-under=80
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.pytest == 'current'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false  # don't break CI on Codecov outages
          flags: unittests
          name: pytest-wardenbot
        # OIDC authenticates the upload via GitHub's id-token (no CODECOV_TOKEN
        # secret stored). Requires `id-token: write` on this job (above) and the
        # repo activated on codecov.io via the Codecov GitHub App.

  test-with-judge:
    name: Test (Python 3.12, [judge] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with [judge] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,judge]"
      - name: Run tests (verifies [judge] install path)
        run: pytest -ra

  sdk-contracts:
    name: Real SDK contracts (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact supported SDK floors
        if: matrix.dependencies == 'minimum'
        run: >-
          pip install -e ".[dev]" "openai==1.66.3" "anthropic==0.49.0"
          "langchain-core==0.3.0" "deepeval==4.2.8"
      - name: Install current SDKs and the tested graph example
        if: matrix.dependencies == 'current'
        run: pip install -e ".[dev,openai,anthropic,langchain,judge]" "langgraph==1.2.14"
      - name: Verify dependencies and report versions
        run: |
          pip check
          pip list
          python -c "import openai, anthropic, langchain_core, deepeval"
      - name: Typecheck with installed SDK interfaces
        run: pyright
      - name: Exercise real SDKs without provider requests
        run: >-
          pytest tests/test_sdk_contracts.py tests/test_deepeval_contracts.py
          tests/test_openai_responses_adapter.py
          tests/test_langchain_adapter.py tests/test_sync_bridge.py
          tests/test_support_agent.py tests/test_support_pilot.py tests/test_support_review.py -ra
      - name: Execute the graph state recipe
        if: matrix.dependencies == 'current'
        run: python examples/langgraph_state/chatbot.py

  test-integrations:
    name: Full suite (all integration extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_UPDATE_WARNING_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the complete tested integration environment
        run: >-
          pip install -e ".[dev,judge,mcp,openai,anthropic,langchain]"
          "langgraph==1.2.14" "pytest-xdist==3.8.0"
      - name: Check dependency resolution and the full suite together
        run: |
          pip check
          coverage run -m pytest -ra
          coverage report --fail-under=90
          coverage xml
      - name: Upload complete integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false
          flags: integrations
          name: pytest-wardenbot-integrations

  mcp-contracts:
    name: MCP harness (Python ${{ matrix.python }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            dependencies: minimum
          - python: "3.12"
            dependencies: current
          - python: "3.13"
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact MCP dependency floors
        if: matrix.dependencies == 'minimum'
        run: pip install -e ".[dev,mcp,openai]" "mcp==2.2.0" "uvicorn==0.31.1" "openai==1.66.3"
      - name: Install current supported MCP SDK
        if: matrix.dependencies == 'current'
        run: pip install -e ".[dev,mcp,openai]"
      - name: Check required coverage with distributed pytest
        if: matrix.python == '3.12' && matrix.dependencies == 'current'
        run: pip install "pytest-xdist==3.8.0"
      - name: Verify optional dependencies
        run: |
          pip check
          pip list
          python -c "import mcp, uvicorn; from pytest_wardenbot.mcp import MCPHarness"
      - name: Typecheck installed MCP interfaces
        run: pyright
      - name: Exercise real local transports and agent outcomes
        run: |
          coverage run -m pytest tests/test_agent*.py tests/test_campaign*.py tests/test_mcp*.py tests/test_reference_agent.py -ra
          coverage xml
      - name: Upload MCP coverage to Codecov
        if: matrix.python == '3.12' && matrix.dependencies == 'current'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false
          flags: mcp
          name: pytest-wardenbot-mcp
      - name: Run the controlled MCP example
        run: python examples/mcp_harness/run_controls.py
      - name: Run isolated campaign controls
        run: python examples/agent_campaign/run_controls.py
      - name: Run the reference agent with offline model controls
        run: python scripts/evaluation/agent_pilot.py --output /tmp/reference-agent-controls.json

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-with-judge, sdk-contracts, test-integrations, mcp-contracts, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build
        run: python -m build
      - name: Verify with twine
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: pip install -e ".[docs]"
      - name: Build documentation
        run: mkdocs build --strict

  consumer:
    name: Fresh-wheel consumer (pytest ${{ matrix.pytest }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pytest: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/consumer-venv"
          "$RUNNER_TEMP/consumer-venv/bin/python" -m pip install dist/*.whl
      - name: Select minimum supported pytest
        if: matrix.pytest == 'minimum'
        run: '"$RUNNER_TEMP/consumer-venv/bin/python" -m pip install "pytest==8.1.1"'
      - name: Run external consumer checks
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/consumer-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_consumer.py"'
      - name: Replay portable evidence with the installed core wheel
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/consumer-venv/bin/python" "$GITHUB_WORKSPACE/examples/evidence/run_controls.py"'
      - name: Verify installed application packs and required coverage
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/consumer-venv/bin/python" "$GITHUB_WORKSPACE/examples/application_packs/run_controls.py"
          "$RUNNER_TEMP/consumer-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_consumer.py" --applications

      - name: Install the support example's OpenAI extra without MCP
        run: |
          "$RUNNER_TEMP/consumer-venv/bin/python" - <<'PY'
          import glob, subprocess, sys
          wheel, = glob.glob("dist/*.whl")
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheel + "[openai]"])
          subprocess.check_call([sys.executable, "-m", "pip", "check"])
          PY
      - name: Verify the second installed application with an offline model
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/consumer-venv/bin/python" -c "import importlib.util; assert importlib.util.find_spec('mcp') is None"
          "$RUNNER_TEMP/consumer-venv/bin/python" "$GITHUB_WORKSPACE/scripts/evaluation/support_pilot.py" --output support-controls.json

  consumer-mcp:
    name: Fresh-wheel MCP consumer (pytest ${{ matrix.pytest }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pytest: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel with its MCP extra
        run: |
          python -m venv "$RUNNER_TEMP/mcp-consumer"
          "$RUNNER_TEMP/mcp-consumer/bin/python" - <<'PY'
          import glob, subprocess, sys
          wheel, = glob.glob("dist/*.whl")
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheel + "[mcp,openai]"])
          subprocess.check_call([sys.executable, "-m", "pip", "check"])
          PY
      - name: Select minimum supported pytest
        if: matrix.pytest == 'minimum'
        run: '"$RUNNER_TEMP/mcp-consumer/bin/python" -m pip install "pytest==8.1.1"'
      - name: Exercise installed subprocess package and controls
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/mcp-consumer/bin/python" "$GITHUB_WORKSPACE/examples/mcp_harness/run_controls.py" --transport stdio > mcp-controls.json
          "$RUNNER_TEMP/mcp-consumer/bin/python" - <<'PY'
          import json, pathlib
          import pytest_wardenbot
          assert "site-packages" in pytest_wardenbot.__file__
          outcomes = json.loads(pathlib.Path("mcp-controls.json").read_text())
          assert len(outcomes) == 12
          print("Installed MCP wheel: all 12 control outcomes verified")
          PY
      - name: Verify installed pytest agent scenarios and required coverage
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/mcp-consumer/bin/python" "$GITHUB_WORKSPACE/scripts/check_consumer.py" --agents'
      - name: Verify installed reference agent with an offline model
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/mcp-consumer/bin/python"
          "$GITHUB_WORKSPACE/scripts/evaluation/agent_pilot.py"
          --transport stdio --output reference-agent-controls.json
      - name: Verify installed campaign controls
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/mcp-consumer/bin/python" "$GITHUB_WORKSPACE/examples/agent_campaign/run_controls.py"'
