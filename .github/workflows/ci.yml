name: CI

# Actions are referenced by major-version tag (@v4, @v5) for CI convenience —
# Dependabot (.github/dependabot.yml) tracks SHA updates and proposes
# narrowing PRs as new patches land. The release workflow
# (.github/workflows/release.yml) SHA-pins explicitly because that's the
# supply-chain-critical publish path; CI's build job is verification only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same PR/branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with judge extra (so deepeval types resolve)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,judge]"
      - name: pyright
        run: pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
      id-token: write  # OIDC token for tokenless Codecov upload (use_oidc)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        # Using `coverage run -m pytest` instead of `pytest --cov` so that the
        # plugin's entry-point-loaded modules (loaded before pytest-cov starts)
        # are also measured.
        run: |
          coverage run -m pytest -ra
          coverage report --fail-under=80
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false  # don't break CI on Codecov outages
          flags: unittests
          name: pytest-wardenbot
        # OIDC authenticates the upload via GitHub's id-token (no CODECOV_TOKEN
        # secret stored). Requires `id-token: write` on this job (above) and the
        # repo activated on codecov.io via the Codecov GitHub App.

  test-with-judge:
    name: Test (Python 3.12, [judge] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with [judge] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,judge]"
      - name: Run tests (verifies [judge] install path)
        run: pytest -ra

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build
        run: python -m build
      - name: Verify with twine
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
