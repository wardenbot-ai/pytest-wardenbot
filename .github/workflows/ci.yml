name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (pyright)
        run: pyright

      - name: Test (with accurate coverage via `coverage run`)
        # Using `coverage run -m pytest` instead of `pytest --cov` so that the
        # plugin's entry-point-loaded modules (loaded before pytest-cov starts)
        # are also measured. Same test run, accurate numbers.
        run: |
          coverage run -m pytest -ra
          coverage report
          coverage xml

      - name: Verify package builds
        run: |
          pip install build
          python -m build
