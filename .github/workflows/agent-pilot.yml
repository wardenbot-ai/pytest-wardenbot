name: Agent integration pilot

# Explicitly dispatched only: this calls a paid model against a local synthetic
# application fixture. Ordinary CI uses offline controls and needs no credentials.
on:
  workflow_dispatch:
    inputs:
      application:
        description: Local application to evaluate
        type: choice
        required: true
        default: mcp
        options: [mcp, support]
      model:
        description: Responses model ID supporting function calls and reasoning effort none
        required: true
        default: gpt-5.4-mini-2026-03-17
        type: string

permissions:
  contents: read

concurrency:
  group: agent-integration-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reference dependencies
        run: pip install ".[mcp,openai]"
      - name: Run paired MCP development and holdout trials
        if: inputs.application == 'mcp'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PILOT_MODEL: ${{ inputs.model }}
        run: >-
          python scripts/evaluation/agent_pilot.py --live --model "$PILOT_MODEL"
          --samples 2 --split all --max-calls 64 --max-output-tokens 512
          --timeout 30 --campaign-timeout 180 --output agent-pilot.json
      - name: Run the direct support application and benign controls
        if: inputs.application == 'support'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PILOT_MODEL: ${{ inputs.model }}
        run: >-
          python scripts/evaluation/support_pilot.py --live --model "$PILOT_MODEL"
          --samples 2 --split all --max-model-calls 160 --max-calls 512
          --max-output-tokens 512 --max-turns 16 --timeout 30
          --campaign-timeout 300 --output agent-pilot.json
      - name: Preserve sanitized results, including failed controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-pilot
          path: agent-pilot.json
          if-no-files-found: warn
          retention-days: 14
