name: Community updates

on:
  # Safe use of workflow_run: the job checks out only the default branch, and
  # scripts/notify_community.py ignores runs from forks and anything but pushes
  # to main or release tags, and disables chat mentions.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["Release", "CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview payloads without posting to Slack or Discord"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: community-updates
  cancel-in-progress: false

jobs:
  notify:
    name: Post trusted workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and optionally post update
        env:
          COMMUNITY_NOTIFICATIONS_ENABLED: ${{ vars.COMMUNITY_NOTIFICATIONS_ENABLED }}
          COMMUNITY_NOTIFY_CI: ${{ vars.COMMUNITY_NOTIFY_CI }}
          COMMUNITY_SLACK_WEBHOOK_URL: ${{ secrets.COMMUNITY_SLACK_WEBHOOK_URL }}
          COMMUNITY_DISCORD_WEBHOOK_URL: ${{ secrets.COMMUNITY_DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--event-file "$GITHUB_EVENT_PATH")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--preview)
            if [[ "$DRY_RUN" == "true" ]]; then
              args+=(--dry-run)
            fi
          fi
          python scripts/notify_community.py "${args[@]}"
