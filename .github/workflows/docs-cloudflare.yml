name: docs-cloudflare

# Builds the mkdocs site and deploys it to the Cloudflare Pages project
# `pytest-wardenbot` (Direct Upload), which serves the primary docs domain
# https://pytest-wardenbot.wardenbot.ai/. The separate docs.yml workflow keeps
# deploying the same site to GitHub Pages as a fallback.
#
# The Cloudflare token is only available to the deploy job. That job runs no
# repository code and installs nothing from PyPI: it downloads the built site
# and runs a SHA-pinned action with an exact wrangler version. The build runs
# with hash-locked requirements and no secrets.
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID, preferably
# stored in the `docs` environment, which only main can deploy to.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/pytest_wardenbot/**"
      - ".github/workflows/docs-cloudflare.yml"
      - "requirements/docs.txt"
      - "scripts/check_docs.py"
      - "scripts/mkdocs_llms.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked docs dependencies
        run: python -m pip install --require-hashes -r requirements/docs.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: https://pytest-wardenbot.wardenbot.ai/
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docs-site
          path: site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          wranglerVersion: "4.152.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pytest-wardenbot --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify the deployed site
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify deployed navigation, assets and llms.txt
        run: python scripts/check_docs.py https://pytest-wardenbot.wardenbot.ai/ --attempts 8
