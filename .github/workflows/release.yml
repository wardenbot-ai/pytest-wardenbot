name: Release

# Triggered on tag push v*. Builds sdist + wheel, runs twine check, then
# publishes to PyPI via OIDC Trusted Publishing — no long-lived API tokens.
#
# PyPI setup for the existing project (also required after a GitHub transfer):
#   https://pypi.org/manage/project/pytest-wardenbot/settings/publishing/
#   Add a GitHub Trusted Publisher with owner=wardenbot-ai,
#   repository=pytest-wardenbot, workflow=release.yml, environment=pypi.
#   This is a project publisher, not a pending publisher for a new package.
#   See CONTRIBUTING.md for release and ownership-transfer verification.
#
# Actions are SHA-pinned (not tag-pinned) because this is the
# supply-chain-critical publish path. Dependabot (.github/dependabot.yml)
# proposes SHA updates on action revisions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version in pyproject.toml matches tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(python -c "import tomllib, pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag: $tag_version  /  pyproject.toml: $file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $file_version"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify with twine
        run: twine check --strict dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-wardenbot/
    permissions:
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
      # Needed by gh-action-pypi-publish if it ever needs to attach assets.
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Trusted Publishing requires id-token: write above. No password/token.
          packages-dir: dist/
          # Verify the same dist matches the metadata before upload.
          verify-metadata: true
          # If a sibling release already pushed the same version, fail loudly
          # rather than silently doing nothing.
          skip-existing: false
