name: Release

# Triggered by pushing a v* tag. Publishing needs, in order:
#   1. the tagged commit is on main and CI passed on that exact commit;
#   2. a reproducible sdist + wheel built with hash-locked tools, plus a
#      CycloneDX SBOM of the core install;
#   3. GitHub attestations for the build provenance and the SBOM;
#   4. approval of the `pypi` environment by a required reviewer, which only
#      v* tags can deploy to;
#   5. PyPI Trusted Publishing (OIDC, no long-lived token), which also uploads
#      PEP 740 attestations.
#
# PyPI setup for the existing project (also required after a GitHub transfer):
#   https://pypi.org/manage/project/pytest-wardenbot/settings/publishing/
#   Add a GitHub Trusted Publisher with owner=wardenbot-ai,
#   repository=pytest-wardenbot, workflow=release.yml, environment=pypi.
#   See CONTRIBUTING.md for release and ownership-transfer verification.
#
# Every action is pinned to a full commit SHA; Dependabot proposes updates.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag is on main and CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Wait for CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion,url)
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "CI passed: $(echo "$runs" | jq -r '[.[] | select(.conclusion == "success")][0].url')"
              exit 0
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              echo "::error::CI did not pass on $GITHUB_SHA: $runs"
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA (check $attempt)..."
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  build:
    name: Build sdist, wheel and SBOM
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/release.txt

      - name: Verify version in pyproject.toml matches tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(python -c "import tomllib, pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag: $tag_version  /  pyproject.toml: $file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $file_version"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify with twine
        run: twine check --strict dist/*

      - name: Generate a CycloneDX SBOM of the core install
        # Records the runtime dependencies pip resolved for the wheel at release
        # time. Extras add more; this is what `pip install pytest-wardenbot` gets.
        run: |
          set -euo pipefail
          python -m venv --without-pip "$RUNNER_TEMP/sbom-target"
          python -m pip --python "$RUNNER_TEMP/sbom-target/bin/python" install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --output-reproducible --of JSON \
            -o "sbom/pytest-wardenbot-$GITHUB_REF_NAME.cdx.json" "$RUNNER_TEMP/sbom-target"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  attest:
    name: Attest build provenance and SBOM
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: sbom/pytest-wardenbot-${{ github.ref_name }}.cdx.json

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      # Requires approval by a reviewer; only v* tags can deploy here.
      name: pypi
      url: https://pypi.org/project/pytest-wardenbot/
    permissions:
      contents: read
      id-token: write  # OIDC token for PyPI Trusted Publishing.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          verify-metadata: true
          # Fail loudly if this version already exists.
          skip-existing: false
