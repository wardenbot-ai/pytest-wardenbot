name: live-api-smoke

# Round-trip smoke test: verifies the bundled OpenAI + Anthropic adapters still
# reach the LIVE vendor APIs and parse responses (SDK/adapter drift detection).
# Not a security check — a model failing a probe is not an adapter failure.
# The rest of CI uses stubs. Costs a few cents per run.
# Requires repo secrets: OPENAI_API_KEY, ANTHROPIC_API_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC. Delete this block for manual-only (no scheduled spend).

permissions:
  contents: read

concurrency:
  group: live-api-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Adapters vs live APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic]"

      # Each step runs only its provider's round-trip test. live_smoke/ lives
      # outside `testpaths`, so it is never part of the default test suite.
      - name: OpenAI adapter round-trip
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY secret not set"; exit 1; }
          pytest live_smoke/test_live_adapters.py -k openai -ra

      - name: Anthropic adapter round-trip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret not set"; exit 1; }
          pytest live_smoke/test_live_adapters.py -k anthropic -ra
