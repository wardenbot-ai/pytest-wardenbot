name: live-api-smoke

# Round-trip smoke test: verifies the bundled OpenAI + Anthropic adapters still
# reach the LIVE vendor APIs and parse responses (SDK/adapter drift detection).
# Not a security check — a model failing a probe is not an adapter failure.
# The rest of CI uses stubs. Costs a few cents per run.
# Requires repo secrets: OPENAI_API_KEY, ANTHROPIC_API_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC. Delete this block for manual-only (no scheduled spend).

permissions:
  contents: read

concurrency:
  group: live-api-smoke
  cancel-in-progress: false

jobs:
  openai:
    name: OpenAI adapter vs live API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic]"

      - name: OpenAI adapter round-trip
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest live_smoke/test_live_adapters.py -k openai -ra --tb=short

  anthropic:
    name: Anthropic adapter vs live API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic]"
      - name: Anthropic adapter round-trip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest live_smoke/test_live_adapters.py -k anthropic -ra --tb=short
