name: live-api-smoke

# Smoke-tests the bundled OpenAI + Anthropic adapters against the LIVE vendor
# APIs (the rest of CI uses stubs). Costs a few cents per run.
# Requires repo secrets: OPENAI_API_KEY, ANTHROPIC_API_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC. Delete this block for manual-only (no scheduled spend).

permissions:
  contents: read

concurrency:
  group: live-api-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Adapters vs live APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic]"

      # Examples are run as separate steps: both define test_my_bot.py, which
      # collides in a single pytest invocation (no __init__.py / unique basename).
      - name: OpenAI adapter smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY secret not set"; exit 1; }
          pytest examples/openai_chat -ra

      - name: Anthropic adapter smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret not set"; exit 1; }
          pytest examples/anthropic_messages -ra
