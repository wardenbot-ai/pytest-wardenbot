version: 2
updates:
  # GitHub Actions: every action is pinned to a commit SHA (the repository
  # requires it). Dependabot proposes SHA updates with the release tag in the
  # trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    # Wait until a release is two weeks old, so a compromised or broken
    # release is likely caught before it reaches CI or a release build.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Python dependencies: pyproject.toml (mostly >= ranges, plus the pinned dev
  # tools) and the hash-locked tool requirements in requirements/. When the
  # dev ruff pin changes, update .pre-commit-config.yaml to match.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    # Wait until a release is two weeks old, so a compromised or broken
    # release is likely caught before it reaches CI or a release build.
    cooldown:
      default-days: 14
    groups:
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
