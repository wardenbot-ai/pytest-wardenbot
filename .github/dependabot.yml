version: 2
updates:
  # GitHub Actions: every action is pinned to a commit SHA (the repository
  # requires it). Dependabot proposes SHA updates with the release tag in the
  # trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Python dependencies — Python deps are mostly pinned with >= ranges in
  # pyproject.toml, so Dependabot's value here is announcing major-version
  # bumps in our extras (deepeval, openai, anthropic) so we can test against
  # them and bump the lower bound if needed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Hash-locked tool requirements for the docs build, release build/SBOM and
  # dependency audit. Regenerate a whole file with the command in its header.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: tuesday
    groups:
      tool-locks:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
